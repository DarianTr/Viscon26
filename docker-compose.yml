# The whole app: `docker compose up --build` → http://localhost:3000
#
#   db         Postgres, data kept in the `pgdata` volume
#   migrate    one-off: applies migrations, creates the admin account if missing
#   app        the Next.js server, started once `migrate` has succeeded
#   knowledge  per-topic knowledge state (Python, services/knowledge); keeps its
#              tables in its own `knowledge` schema and is reachable from `app`
#              at http://knowledge:8000
#   direct     optional (COMPOSE_PROFILES=direct): HTTPS on the VM's direct
#              address for the calendar feed only — see deploy/Caddyfile
#
# For local development run only the database (`npm run db:up`) and use
# `npm run dev` — see README.

x-database-url: &database-url postgres://stride:${POSTGRES_PASSWORD:-stride}@db:5432/stride

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      POSTGRES_DB: stride
    # Localhost only: Docker-published ports can bypass the host firewall.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
      # The admin account belongs to whoever logs in with ADMIN_EMAIL.
      ADMIN_HANDLE: ${ADMIN_HANDLE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KNOWLEDGE_URL: http://knowledge:8000
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      NUDGES: ${NUDGES:-on}
      # Login comes from the reverse proxy's X-User-Id header. Without the proxy
      # (local runs), these stand in for it. Never set them on the VM.
      DEV_USER_ID: ${DEV_USER_ID:-}
      DEV_USER_NAME: ${DEV_USER_NAME:-}
      CALENDAR_FEED_ORIGIN: ${CALENDAR_FEED_ORIGIN:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  knowledge:
    build: services/knowledge
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    # Internal API: localhost only, for development and debugging.
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  direct:
    image: caddy:2.10-alpine
    profiles: [direct]
    restart: unless-stopped
    environment:
      CALENDAR_FEED_ORIGIN: ${CALENDAR_FEED_ORIGIN:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "${DIRECT_HTTP_PORT:-80}:80"
      - "${DIRECT_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep them, or Let's Encrypt rate-limits re-issuing.
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
